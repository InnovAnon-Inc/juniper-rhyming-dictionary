<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Narrator Broadcast</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --highlight: #f59e0b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--card-bg);
            padding-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-color);
        }

        .audio-banner {
            background: #0284c7;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .status-badge {
            display: inline-block;
            background: var(--highlight);
            color: #000;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .word-title {
            font-size: 3rem;
            font-weight: 800;
            margin: 5px 0;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .word-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .word-chip {
            padding: 6px 12px;
            background: #334155;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .word-chip.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        .sense-block {
            border-left: 3px solid var(--accent-color);
            padding-left: 12px;
            margin-bottom: 16px;
        }

        .sense-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .meta-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .meta-value {
            font-size: 1rem;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Centralized Audio Narrator</h1>
        <p style="color: var(--text-muted); margin: 5px 0 0 0;">Synchronized live phonics & dictionary feed</p>
    </div>

    <!-- Mobile Audio Unlock Banner -->
    <div id="audio-enable-btn" class="audio-banner">
        🔊 Tap here to Enable Synchronized Mobile Audio
    </div>

    <!-- Super Group Status Card -->
    <div class="card">
        <div class="meta-label">Active Super Group Theme</div>
        <div id="super-group-theme" style="font-size: 1.2rem; font-weight: bold; color: var(--highlight); margin-top: 4px;">Syncing...</div>
    </div>

    <!-- Live Status Card -->
    <div class="card">
        <div id="step-badge" class="status-badge">Syncing...</div>
        <div id="group-label" style="color: var(--text-muted); font-size: 0.9rem;"></div>
        
        <div id="current-word" class="word-title">---</div>

        <div class="meta-label" style="margin-top: 15px;">Current Group Wordlist</div>
        <div id="wordlist" class="word-list"></div>
    </div>

    <!-- Detailed Word Metadata Card -->
    <div class="card">
        <h3 style="margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 8px;">Word Metadata</h3>
        <div id="senses-container">
            <div style="color: var(--text-muted);">Waiting for word details...</div>
        </div>
    </div>
</div>

<script>
    let audioAllowed = false;
    let lastAudioId = -1;
    let isPlaying = false;
    const player = new Audio();

    player.addEventListener('ended', () => {
        isPlaying = false;
    });

    document.getElementById('audio-enable-btn').addEventListener('click', () => {
        audioAllowed = true;
        player.play().catch(() => {});
        document.getElementById('audio-enable-btn').style.display = 'none';
    });

    async function updateState() {
        try {
            const res = await fetch('/api/state');
            const data = await res.json();

            document.getElementById('super-group-theme').innerText = data.super_group_theme || 'Initializing...';
            document.getElementById('step-badge').innerText = data.step || 'Idle';
            document.getElementById('group-label').innerText = data.group_label || '';
            document.getElementById('current-word').innerText = data.current_word || '---';

            // Wordlist chips
            const listContainer = document.getElementById('wordlist');
            listContainer.innerHTML = '';
            (data.wordlist || []).forEach(w => {
                const chip = document.createElement('span');
                chip.className = 'word-chip' + (w === data.current_word ? ' active' : '');
                chip.innerText = w;
                listContainer.appendChild(chip);
            });

            // Populate Metadata multi-senses
            const sensesContainer = document.getElementById('senses-container');
            const meta = data.metadata || {};
            const senses = meta.senses || [];

            if (senses.length === 0) {
                sensesContainer.innerHTML = '<div style="color: var(--text-muted);">No metadata available.</div>';
            } else {
                sensesContainer.innerHTML = '';
                senses.forEach((sense, idx) => {
                    const senseDiv = document.createElement('div');
                    senseDiv.className = 'sense-block';

                    const title = document.createElement('div');
                    title.className = 'sense-title';
                    title.innerText = `Definition ${idx + 1} (${sense.pos})`;
                    senseDiv.appendChild(title);

                    const grid = document.createElement('div');
                    grid.className = 'meta-grid';

                    const createItem = (label, val) => {
                        const item = document.createElement('div');
                        const lbl = document.createElement('div');
                        lbl.className = 'meta-label';
                        lbl.innerText = label;
                        const v = document.createElement('div');
                        v.className = 'meta-value';
                        v.innerText = Array.isArray(val) ? (val.join(', ') || 'None') : (val || '-');
                        item.appendChild(lbl);
                        item.appendChild(v);
                        return item;
                    };

                    grid.appendChild(createItem('Definition', sense.definition));
                    grid.appendChild(createItem('Example Sentences', sense.examples));
                    if (sense.synonyms && sense.synonyms.length) grid.appendChild(createItem('Synonyms', sense.synonyms));
                    if (sense.antonyms && sense.antonyms.length) grid.appendChild(createItem('Antonyms', sense.antonyms));
                    if (sense.hypernyms && sense.hypernyms.length) grid.appendChild(createItem('Hypernyms', sense.hypernyms));
                    if (sense.hyponyms && sense.hyponyms.length) grid.appendChild(createItem('Hyponyms', sense.hyponyms));

                    senseDiv.appendChild(grid);
                    sensesContainer.appendChild(senseDiv);
                });
            }

            // Play audio if a new ID is received
            if (audioAllowed && data.audio_file && data.audio_id !== lastAudioId) {
                lastAudioId = data.audio_id;
                isPlaying = true;
                player.src = `/audio/${data.audio_file}?t=${Date.now()}`;
                player.play().catch(e => console.log('Playback blocked:', e));
            }

        } catch (err) {
            console.error('Sync error:', err);
        }
    }

    setInterval(updateState, 300);
    updateState();
</script>

</body>
</html>
